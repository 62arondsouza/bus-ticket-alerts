# Runs check_price.py every 30 minutes for free using GitHub Actions,
# and commits the latest known prices back to the repo so the next run
# can compare against them.

name: Bus price check

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: Check price
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_price.py

      - name: Save updated prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add last_prices.json
          git diff --staged --quiet || git commit -m "chore: update last known prices [skip ci]"
          git push